# Copy to ~/.contreex/workspaces/corporate.yaml — only ever active when a
# project's .contreex-profile explicitly sets "profile: corporate". Fill in
# real MCP server definitions at ~/.contreex/mcp-servers/<name>.json before
# relying on this for anything but the example below.
name: corporate
mcp:
  - corporate
  - github
  - jira
  - confluence

# Example of a workspace-level override: this company prefers a different
# provider than the global default for reviewer2. Proves a provider swap is
# a one-line config change in exactly one cascade layer, never a code change.
roles:
  reviewer2: mimo

# MCP as a capability, not a server name (ROADMAP.md item 11): an agent asks
# for "git" or "issueTracker", never a literal server — this workspace
# decides which concrete server (from the `mcp` list above) actually answers
# it. A capability with no entry here is reported as unavailable, not an
# error, so the same request degrades gracefully in a workspace that doesn't
# define it (e.g. "home", which has no issueTracker at all).
capabilities:
  git: corporate
  issueTracker: jira
  docs: confluence
