# Copy to <your-project>/.contreex-profile — this is what actually selects
# the workspace. Contreex walks up from the current directory looking for
# this file, the same way git looks for .git. No file found = no default
# workspace assumed; resolveConfig() throws instead of guessing.
profile: home

