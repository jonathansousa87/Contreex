# Enterprise — critical's consensus loop with a third reviewer (changed
# 2026-07-12, see critical.yaml for the loop semantics). There's no
# dedicated security/compliance action yet (ROADMAP.md item 9's
# "securityReview"/"documentationReview" step types) — this is the most
# thorough preset available with today's action set, not a placeholder for
# those; revisit once those actions exist. Requires "reviewer1", "reviewer2"
# AND "reviewer3" in roles (e.g. codex + agy + mimo).
pipeline:
  - role: implementer
    action: analyze
  - loop:
      maxRounds: 3
      reviewers:
        - role: reviewer1
          action: review
        - role: reviewer2
          action: review
        - role: reviewer3
          action: review
